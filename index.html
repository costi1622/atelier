<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier · manual de tehnici</title>
<meta name="description" content="Manual de tehnici de cusut, croșetat și tricotat, pas cu pas, cu desene.">
<meta name="theme-color" content="#2C6A54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --fs:1;
  --paper:#F6F7F4; --panel:#FFFFFF; --grid:#D3DDD7; --ink:#1F2B33; --muted:#5A6770;
  --line:#CBD3CE; --mat:#2C6A54; --mat-soft:#E3EFE9; --thread:#C0283F; --amber:#8A5D0A;
  --fab:#D9E5EF; --fabS:#7FA3C2; --fab2:#F0DDB4; --fab2S:#C0913A;
  --tape:#8795A3; --yarn:#9C4E7C; --yarnH:#E0A21A; --hook:#6E7C86; --gap:#B9C3CA;
  --metalHi:#D7DEE3; --yarnHi:#C173A0;
  --bgdot:rgba(44,106,84,.16); --bgweave:rgba(31,43,51,.035); --bgglow:rgba(44,106,84,.13); --bgedge:rgba(192,40,63,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12181C; --panel:#1A2228; --grid:#2A363E; --ink:#E4EAEE; --muted:#9AA8B1;
    --line:#2F3B44; --mat:#72B99B; --mat-soft:#1E3129; --thread:#FF6F86; --amber:#E0B45A;
    --fab:#2A3B4B; --fabS:#6E93B4; --fab2:#4A3F2A; --fab2S:#C9A15A;
    --tape:#6D7D8C; --yarn:#D38DB7; --yarnH:#F2C14E; --hook:#9AA8B1; --gap:#3A4852;
    --metalHi:#7E8D98; --yarnHi:#E7AFD0;
    --bgdot:rgba(114,185,155,.13); --bgweave:rgba(255,255,255,.03); --bgglow:rgba(114,185,155,.10); --bgedge:rgba(255,111,134,.14);
  }
}
:root[data-theme="dark"]{
  --paper:#12181C; --panel:#1A2228; --grid:#2A363E; --ink:#E4EAEE; --muted:#9AA8B1;
  --line:#2F3B44; --mat:#72B99B; --mat-soft:#1E3129; --thread:#FF6F86; --amber:#E0B45A;
  --fab:#2A3B4B; --fabS:#6E93B4; --fab2:#4A3F2A; --fab2S:#C9A15A;
  --tape:#6D7D8C; --yarn:#D38DB7; --yarnH:#F2C14E; --hook:#9AA8B1; --gap:#3A4852;
  --metalHi:#7E8D98; --yarnHi:#E7AFD0;
  --bgdot:rgba(114,185,155,.13); --bgweave:rgba(255,255,255,.03); --bgglow:rgba(114,185,155,.10); --bgedge:rgba(255,111,134,.14);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 calc(17px*var(--fs))/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Bitter,Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
/* fundalul: hârtie de tipar, cu puncte, textură de țesătură și o lumină caldă sus */
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    radial-gradient(circle at 50% -10%, var(--bgglow), transparent 62%),
    radial-gradient(circle, var(--bgdot) 1.1px, transparent 1.5px),
    repeating-linear-gradient(45deg, var(--bgweave) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(-45deg, var(--bgweave) 0 1px, transparent 1px 9px);
  background-size:100% 70vh, 24px 24px, auto, auto;
  background-position:50% 0, 8px 8px, 0 0, 0 0;
  background-repeat:no-repeat, repeat, repeat, repeat}
/* o cusătură fină pe marginea paginii, ca pe un tipar */
body::after{content:'';position:fixed;top:0;bottom:0;left:50%;width:min(680px,100%);transform:translateX(-50%);
  z-index:-1;pointer-events:none;
  border-left:1px dashed var(--bgedge);border-right:1px dashed var(--bgedge)}
@media (max-width:700px){body::after{display:none}}
a{color:var(--mat)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mat);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- home ---------- */
.mast{padding:30px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mast h1{font-size:calc(44px*var(--fs));font-weight:700;letter-spacing:-.01em}
.mast p{margin:6px 0 0;color:var(--muted);max-width:32em}
.mast-t{flex:1}
.gear{flex:none;display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--line);color:var(--ink);text-decoration:none;margin-top:4px}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tape{height:14px;margin-top:16px;border:1.5px solid var(--ink);border-radius:2px;
  background:
   repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px) 0 100%/100% 5px no-repeat,
   repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 40px) 0 100%/100% 9px no-repeat;
  opacity:.8}
.news{margin:0 0 16px;padding:12px 14px;border:1.5px solid var(--mat);border-radius:10px;background:var(--mat-soft)}
.news h2{font-size:calc(17px*var(--fs));margin-bottom:4px}
.news ul{margin:4px 0 8px;padding-left:20px}
.news button{border:0;background:none;color:var(--mat);font-weight:600;padding:6px 0;cursor:pointer;min-height:40px}
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--panel);
  border:1.5px solid var(--line);border-radius:10px;padding:12px 14px 12px 40px;min-height:48px}
.search input:focus{border-color:var(--mat);outline:none}
.search svg{position:absolute;left:13px;top:50%;margin-top:-9px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:calc(23px*var(--fs));font-weight:600}
.sec-h span{color:var(--muted);font-size:calc(14px*var(--fs))}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);
  text-decoration:none;color:inherit;min-height:52px}
a.row:hover .row-t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.row-t{flex:1;font-weight:600}
.lvl{font-size:calc(13px*var(--fs));padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.lvl.u{color:var(--mat)} .lvl.m{color:var(--amber)} .lvl.a{color:var(--thread)}
.marks{display:flex;gap:6px;color:var(--mat)}
.empty{padding:28px 0;color:var(--muted)}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:calc(14px*var(--fs));
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- sheet ---------- */
.back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 8px;padding:8px 10px 8px 4px;
  text-decoration:none;font-weight:600;min-height:44px}
.head{padding-bottom:16px;border-bottom:2px solid var(--ink)}
.head h1{font-size:calc(34px*var(--fs));font-weight:700;margin:4px 0 10px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:calc(15px*var(--fs))}
.intro{font-size:calc(18px*var(--fs));margin:16px 0 0}
.need{margin:22px 0 0;padding:14px 16px;background:var(--mat-soft);border-radius:10px}
.need h2{font-size:calc(17px*var(--fs));margin-bottom:6px}
.need ul{margin:0;padding-left:20px}
.steps{list-style:none;margin:28px 0 0;padding:0}
.step{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;margin-bottom:30px}
.step-n{font-family:Bitter,Georgia,serif;font-weight:700;font-size:calc(34px*var(--fs));line-height:1;color:var(--mat)}
.step h3{font-size:calc(19px*var(--fs));font-weight:600;margin:4px 0 6px}
.step p{margin:0 0 10px}
.fig{grid-column:1/-1;margin:4px 0 0;background-color:var(--panel);border:1.5px solid var(--ink);border-radius:4px;
  background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.4px);background-size:12px 12px;
  background-position:6px 6px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{border-top:1px solid var(--line);background:var(--panel);padding:6px 10px;font-size:calc(14px*var(--fs));color:var(--muted)}
.fig figcaption b{font-family:Bitter,Georgia,serif;color:var(--ink);font-weight:600;margin-right:4px}
@media (min-width:560px){.step{grid-template-columns:56px 1fr}.fig{grid-column:2}}
.box{margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.box h2{font-size:calc(21px*var(--fs));margin-bottom:8px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:6px}
.notes label{display:block;color:var(--muted);margin-bottom:8px}
.notes textarea{width:100%;min-height:130px;font:inherit;color:var(--ink);background:var(--panel);
  border:1.5px solid var(--line);border-radius:10px;padding:12px;resize:vertical}
.notes textarea:focus{border-color:var(--mat);outline:none}
.notes small{display:block;color:var(--muted);margin-top:6px;min-height:1.4em}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.pn a{display:block;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);min-height:48px}
.pn a span{display:block;font-size:calc(13px*var(--fs));color:var(--muted)}
.pn a.nx{text-align:right;grid-column:2}
.actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:26px -18px 0;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
.act{flex:1;min-height:48px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.act[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- legend, settings ---------- */
.leg{list-style:none;padding:0;margin:18px 0 0}
.leg li{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.leg svg{width:96px;height:48px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.set{margin-top:22px}
.set h2{font-size:calc(21px*var(--fs));margin-bottom:10px}
.set p{margin:0 0 10px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:600}
.btn.pri{background:var(--ink);color:var(--paper)}
.msg{margin-top:10px;color:var(--mat);min-height:1.4em}
.msg.err{color:var(--thread)}

/* ---------- ferestre proprii ---------- */
.ovl{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(12,18,22,.55);padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));
  animation:ovlIn .16s ease-out}
.ovl.out{opacity:0;transition:opacity .14s}
.dlg{width:100%;max-width:440px;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);
  border-radius:16px;padding:20px 18px 16px;box-shadow:0 18px 40px rgba(12,18,22,.28);animation:dlgIn .2s cubic-bezier(.2,.9,.3,1)}
.dlg h2{font-size:calc(22px*var(--fs))}
.dlg p{margin:8px 0 0;color:var(--muted)}
.dlg-f{display:block;margin-top:14px}
.dlg-f span{display:block;color:var(--muted);margin-bottom:6px;font-size:calc(15px*var(--fs))}
.dlg-f input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;min-height:48px}
.dlg-f input:focus{border-color:var(--mat);outline:none}
.dlg-b{display:flex;gap:10px;margin-top:18px}
.dlg-b .btn{flex:1}
.btn.dgr{background:var(--thread);border-color:var(--thread);color:#fff}
@keyframes ovlIn{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{transform:translateY(18px)}to{transform:none}}
@media (min-width:560px){.ovl{align-items:center;padding-bottom:12px}}
@media (prefers-reduced-motion:reduce){.ovl,.dlg{animation:none}}

/* ---------- comutator Învăț / Fac ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.tab{display:block;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);min-height:62px}
.tab b{display:block;font-family:Bitter,Georgia,serif;font-size:calc(19px*var(--fs))}
.tab span{display:block;color:var(--muted);font-size:calc(14px*var(--fs));line-height:1.35;margin-top:2px}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab.on span{color:var(--paper);opacity:.75}
.lead{margin:0 0 14px;color:var(--muted)}
.who{margin:0 0 12px;color:var(--muted);font-size:calc(15px*var(--fs))}
.row-t small{display:block;font-weight:400;color:var(--muted);font-size:calc(14px*var(--fs))}

/* ---------- proiecte ---------- */
.mm{margin-top:10px}
.mm-r{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mm-r span{flex:1}
.mm-r small{display:block;color:var(--muted);font-size:calc(14px*var(--fs))}
.mm-r input{width:5.5em;min-height:46px;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:right}
.mm-r input:focus{border-color:var(--mat);outline:none}
.mm-r b{color:var(--muted);font-weight:400}
.mm-l{margin:14px 0 6px;color:var(--muted)}
.mm-p{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.mm-p span{grid-column:1;color:var(--muted);font-size:calc(15px*var(--fs))}
.mm-p button{grid-row:1/3;grid-column:2;min-height:44px;padding:8px 12px}
.tb{width:100%;border-collapse:collapse;margin-top:12px}
.tb th{text-align:left;font-family:Bitter,Georgia,serif;font-size:calc(15px*var(--fs));border-bottom:1.5px solid var(--ink);padding:6px 6px 6px 0}
.tb td{border-bottom:1px dashed var(--line);padding:8px 6px 8px 0;vertical-align:top}
.tb td:last-child{text-align:right}
.tb small{display:block;color:var(--muted);font-size:calc(14px*var(--fs))}
.big{font-size:calc(19px*var(--fs));margin:12px 0 4px}
.pl{list-style:none;padding:0;margin:8px 0 14px;counter-reset:pl}
.pl li{border-bottom:1px dashed var(--line)}
.pl label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;cursor:pointer}
.pl input{width:24px;height:24px;margin-top:2px;accent-color:var(--mat);flex:none}
.pl b{display:block;font-family:Bitter,Georgia,serif}
.pl li.ok span{color:var(--muted)}
.pl li.ok b{text-decoration:line-through}
.pl a{display:inline-block;margin-top:4px}
.d .cut{fill:var(--paper);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}

/* ---------- copiez din poză ---------- */
.card-cta{display:block;margin:0 0 18px;padding:14px 16px;border:1.5px dashed var(--mat);border-radius:12px;
  background:var(--mat-soft);text-decoration:none;color:var(--ink)}
.card-cta b{display:block;font-family:Bitter,Georgia,serif;font-size:calc(19px*var(--fs))}
.card-cta span{display:block;color:var(--muted);font-size:calc(15px*var(--fs));margin-top:2px}
.ph{position:relative;margin:12px 0 8px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--panel);touch-action:manipulation}
.ph img{display:block;width:100%;height:auto}
.ph-ov{position:absolute;inset:0;width:100%;height:100%}
.ph-ov .phRef{stroke:var(--mat);stroke-width:5;stroke-linecap:round}
.ph-ov .phM{stroke:var(--thread);stroke-width:5;stroke-linecap:round}
.ph-ov .phDotRef{fill:var(--mat);stroke:#fff;stroke-width:2.5}
.ph-ov .phDot{fill:var(--thread);stroke:#fff;stroke-width:2.5}
.ph-ov .phDotNew{fill:#fff;stroke:var(--thread);stroke-width:4}
.hint{margin:0 0 10px;color:var(--thread);min-height:1.4em}
.ok-l{margin:10px 0 0;color:var(--mat)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.dgr{background:transparent;border-color:var(--thread);color:var(--thread)}
.dlg-b .btn.dgr{background:var(--thread);border-color:var(--thread);color:#fff}

/* ---------- persoane ---------- */
.pl-people .pers{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pers-sel{flex:1;text-align:left;background:none;border:0;padding:10px 8px;border-radius:10px;cursor:pointer;min-height:56px}
.pers.on .pers-sel{background:var(--mat-soft)}
.pers-sel b{display:block;font-family:Bitter,Georgia,serif;font-size:calc(18px*var(--fs))}
.pers-sel span{display:block;color:var(--muted);font-size:calc(14px*var(--fs))}
.pers-a{display:flex;gap:6px;flex:none}
.ic{width:46px;height:46px;border:1.5px solid var(--line);background:transparent;border-radius:10px;cursor:pointer;font-size:18px;line-height:1}
.ic.dgr{border-color:var(--thread);color:var(--thread)}

/* ---------- desen mărit ---------- */
.zoom{align-items:center}
.zbox{width:100%;max-width:640px;background:var(--panel);border:1.5px solid var(--ink);border-radius:16px;padding:14px}
.zsvg{background-color:var(--panel);background-image:radial-gradient(circle,var(--grid) 1.1px,transparent 1.4px);
  background-size:16px 16px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.zsvg svg{display:block;width:100%;height:auto}
.zbox p{margin:10px 2px 0;color:var(--muted);font-size:calc(15px*var(--fs))}
.fig.zoomable{cursor:zoom-in;position:relative}
.fig.zoomable::after{content:'⤢';position:absolute;top:6px;right:8px;color:var(--muted);font-size:15px;opacity:.65}

/* ---------- tipărire ---------- */
@media print{
  body::before,body::after,.tabs,.chips,.search,.actions,.gear,.back,.foot,.news,.pn,#updbar,.fig.zoomable::after{display:none !important}
  body{background:#fff;color:#000;font-size:11pt}
  .wrap{max-width:none;padding:0}
  .fig,.step,.box,.tb tr{break-inside:avoid}
  .fig{border-color:#000}
  a[href^="#"]{text-decoration:none;color:#000}
}

/* ---------- manechin ---------- */
.figm{margin:12px 0 4px}
.d .form{fill:url(#weave2);stroke:var(--ink);stroke-width:1.8;filter:url(#soft)}
.d .fabGhost{fill:url(#weave);stroke:var(--fabS);stroke-width:1.2;opacity:.75}
.d .mLine{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4}
.d .mLine.on{stroke:var(--thread);stroke-width:3;stroke-dasharray:none}
.d .tick{stroke:var(--thread);stroke-width:1;stroke-dasharray:3 3}
.d .stand{stroke:var(--hook);stroke-width:4;stroke-linecap:round}

/* ---------- diagnostic ---------- */
.diag{list-style:none;padding:0;margin:18px 0 0}
.diag li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0 10px 26px;border-bottom:1px dashed var(--line);position:relative;word-break:break-word}
.diag li::before{position:absolute;left:0;top:10px;font-weight:700}
.diag li.y::before{content:'✓';color:var(--mat)}
.diag li.n::before{content:'✗';color:var(--thread)}
.diag li.q::before{content:'·';color:var(--muted)}
.diag li b{grid-column:1/-1}
.diag li span{grid-column:1/-1;color:var(--muted);font-size:calc(15px*var(--fs))}

/* ---------- update bar ---------- */

<script>
/* Plasa de siguranță: dacă scriptul principal cade înainte să pornească aplicația,
   arătăm un ecran clar în loc de o pagină goală. Stă primul, fără dependențe. */
var PORNIT=false;
(function(){
  function show(msg){
    if(PORNIT||document.getElementById('crash'))return;
    var d=document.createElement('div');d.id='crash';
    d.setAttribute('style','position:fixed;inset:0;z-index:99;background:#F6F7F4;color:#1F2B33;padding:32px 22px;font:17px/1.55 system-ui,sans-serif;overflow:auto');
    d.innerHTML='<h1 style="font:700 28px Georgia,serif;margin:0 0 12px">Atelier nu a pornit</h1>'+
      '<p style="margin:0 0 10px"><b>Notițele tale sunt în siguranță pe telefon.</b> Problema e la pornire, nu la date.</p>'+
      '<p style="margin:0 0 10px">Închide aplicația și deschide-o din nou. Dacă tot nu merge, trimite textul de mai jos celui care ți-a instalat aplicația.</p>'+
      '<pre style="white-space:pre-wrap;background:#fff;border:1px solid #CBD3CE;border-radius:8px;padding:12px;font-size:13px"></pre>';
    d.querySelector('pre').textContent='Atelier: '+msg;
    (document.body||document.documentElement).appendChild(d);
  }
  window.addEventListener('error',function(e){show((e.message||'eroare')+' @'+(e.lineno||'?'))});
  window.addEventListener('unhandledrejection',function(e){show('promisiune: '+(e.reason&&e.reason.message||e.reason))});
})();
</script>

<script>
"use strict";
const APP_VER='3.0';
const KEY='atelier_v1';
const TECH=[];
/*@@CONTENT_START@@*/
/* ================= diagram helpers =================
   Toate desenele au viewBox 320×190 (sau h dat). Culorile vin din clase CSS,
   deci merg automat în modul luminos și întunecat. */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const R=(x,y,w,h,c,rx=0)=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"${rx?` rx="${rx}"`:''}/>`;
const L=(x1,y1,x2,y2,c)=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const P=(d,c)=>`<path class="${c}" d="${d}"/>`;
const C=(x,y,r,c)=>`<circle class="${c}" cx="${x}" cy="${y}" r="${r}"/>`;
const E=(x,y,rx,ry,c,rot=0)=>`<ellipse class="${c}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"${rot?` transform="rotate(${rot} ${x} ${y})"`:''}/>`;
const T=(x,y,s,a='start',c='')=>`<text x="${x}" y="${y}" text-anchor="${a}"${c?` class="${c}"`:''}>${esc(s)}</text>`;
/* text pe două rânduri: primul îngroșat, al doilea discret */
const T2=(x,y,a,b,an='start')=>T(x,y,a,an)+(b?T(x,y+14,b,an,'m'):'');
const A=(x1,y1,x2,y2,c='arr')=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const AC=(d,c='arr')=>P(d,c);                      /* săgeată curbă */
function zig(x,y1,y2,a=3,s=5,c='zz'){let d=`M${x} ${y1}`,k=0;for(let y=y1+s;y<=y2;y+=s){d+=` L${x+(k%2?-a:a)} ${y}`;k++}return P(d,c)}
const dimV=(x,y1,y2)=>L(x,y1,x,y2,'dim')+L(x-4,y1,x+4,y1,'dim')+L(x-4,y2,x+4,y2,'dim');
const dimH=(y,x1,x2)=>L(x1,y,x2,y,'dim')+L(x1,y-4,x1,y+4,'dim')+L(x2,y-4,x2,y+4,'dim');
function zigH(y,x1,x2,a=4,s=6,c='thr'){let d=`M${x1} ${y}`,k=0;for(let x=x1+s;x<=x2;x+=s){d+=` L${x} ${y+(k%2?-a:a)}`;k++}return P(d,c)}
function pin(x1,y,x2){return L(x1,y,x2,y,'pin')+C(x2,y,3.6,'pinh')}
function pinV(x,y1,y2){return L(x,y1,x,y2,'pin')+C(x,y1,3.6,'pinh')}
function svg(inner,h=190){return `<svg viewBox="0 0 320 ${h}" class="d" aria-hidden="true" focusable="false">${inner}</svg>`}

/* ---- material și cusături ---- */
const fab=(x,y,w,h)=>R(x,y,w,h,'fab');                 /* fața materialului */
const rev=(x,y,w,h)=>R(x,y,w,h,'rev');                 /* dosul materialului */
const seamV=(x,y1,y2)=>L(x,y1,x,y2,'seam');
const seamH=(y,x1,x2)=>L(x1,y,x2,y,'seam');
const stV=(x,y1,y2)=>L(x,y1,x,y2,'st');
const stH=(y,x1,x2)=>L(x1,y,x2,y,'st');
/* secțiune: un strat de material ca linie groasă */
const lay=(d,c='lay')=>P(d,c);
const stx=(x,y1,y2)=>L(x,y1,x,y2,'stx')+C(x,y1,2,'dot')+C(x,y2,2,'dot');
/* ac de mână: vârf la (x,y), orientat după unghi (grade) */
function needle(x,y,ang=0,len=64){const r=ang*Math.PI/180,dx=Math.cos(r),dy=Math.sin(r);
  const x2=x-dx*len,y2=y-dy*len;
  return L(x,y,x2,y2,'ndl')+E(x2+dx*6,y2+dy*6,4,1.6,'ndle',ang)}
/* rând de împunsături: vizibil (față) / ascuns (dos), alternativ */
function run(x1,x2,y,on=14,off=10){let o='';for(let x=x1;x<x2;x+=on+off){o+=L(x,y,Math.min(x+on,x2),y,'thr');if(x+on<x2)o+=L(x+on,y,Math.min(x+on+off,x2),y,'hid')}return o}

/* ---- croșetat ---- */
/* croșeta orizontală: vârful la (x,y), coada spre stânga */
const hookH=(x,y,len=150)=>L(x-len,y,x,y,'hook')+P(`M${x} ${y} q7 -1 5 -9`,'hook');
/* bucle pe croșetă */
function loopsOn(x,y,n,dx=18){let o='';for(let i=0;i<n;i++)o+=E(x-i*dx,y,5,10,'yarn3');return o}
/* lanț de ochiuri orizontal */
function chainH(x,y,n,dx=22){let o='';for(let i=0;i<n;i++)o+=E(x+i*dx,y,10,6,'yarn3');return o}
/* simboluri de diagramă */
const sOL=(x,y)=>E(x,y,8,4.5,'sym');                                  /* ochi lanț */
const sPN=(x,y,s=6)=>L(x-s,y-s,x+s,y+s,'sym')+L(x-s,y+s,x+s,y-s,'sym'); /* punct nedesfăcut */
const sPA=(x,y)=>E(x,y,4,3,'symf');                                   /* punct alunecat */
const sSST=(x,y,h=20)=>L(x,y+h/2,x,y-h/2,'sym')+L(x-6,y-h/2,x+6,y-h/2,'sym');            /* semistâlp */
const sST=(x,y,h=28)=>sSST(x,y,h)+L(x-5,y+2,x+5,y-4,'sym');                               /* stâlp */
const X=sPN;

/* ---- tricotat ---- */
/* andrea: de la (x1,y1) spre vârful (x2,y2) */
function kneedle(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),bx=x2-Math.cos(a)*10,by=y2-Math.sin(a)*10;
  return L(x1,y1,bx,by,'kn')+P(`M${bx-Math.sin(a)*3} ${by+Math.cos(a)*3} L${x2} ${y2} L${bx+Math.sin(a)*3} ${by-Math.cos(a)*3} Z`,'knp')}
/* ochiuri pe andrea orizontală */
function kloops(x,y,n,dx=18){let o='';for(let i=0;i<n;i++)o+=E(x+i*dx,y+6,6,11,'yarn3');return o}
/* grilă de diagramă tricot: cells = array de rânduri (de sus în jos), fiecare string: '.'=față, 'o'=dos, '/'=2 împreună, 'v'=creștere */
function kgrid(x,y,rows,s=16){let o='';rows.forEach((r,j)=>{[...r].forEach((ch,i)=>{const cx=x+i*s,cy=y+j*s;o+=R(cx,cy,s,s,'kcell');
  if(ch==='o')o+=C(cx+s/2,cy+s/2,2.6,'symf');
  if(ch==='/')o+=L(cx+3,cy+s-3,cx+s-3,cy+3,'sym');
  if(ch==='v')o+=P(`M${cx+4} ${cy+4} L${cx+s/2} ${cy+s-4} L${cx+s-4} ${cy+4}`,'sym');
  if(ch==='-')o+=R(cx,cy,s,s,'kgrey')})});return o}

/* ================= LA MAȘINĂ ================= */
TECH.push(
{id:'intarire',sec:'masina',t:'Întărirea la capăt',lvl:'u',time:'5 min de exersat',

  {h:'Pornește la 1 cm de margine',p:'Înțeapă acul la aproximativ 1 cm sub marginea tăiată și coboară piciorușul. Dacă pornești chiar de pe margine, mașina poate trage materialul în placa acului.',
   d:()=>svg(fab(70,18,180,160)+seamV(160,18,178)+C(160,40,4,'dot')+dimV(92,18,40)+T2(100,30,'1 cm','')+T2(176,80,'acul pornește','de aici')+A(174,76,164,46)+T(160,12,'marginea tăiată','middle','m'),190),
   c:'Piesa văzută de sus, linia punctată e cusătura.'},
  {h:'Coase înapoi până la margine',p:'Ține apăsată maneta de mers înapoi și coase 3–4 împunsături, până aproape de margine.',
   d:()=>svg(fab(70,18,180,160)+seamV(160,18,178)+L(160,40,160,22,'thr')+A(160,40,160,24,'arrt')+T2(176,40,'înapoi','3–4 împunsături')),
   c:'Primele împunsături merg spre margine.'},
  {h:'Continuă înainte peste ele',p:'Eliberează maneta și coase înainte, peste împunsăturile de întărire, apoi mai departe pe toată cusătura.',
   d:()=>svg(fab(70,18,180,160)+L(156,40,156,22,'thr')+L(164,22,164,168,'st')+A(186,60,186,140)+T2(196,70,'înainte,','peste întărire')+T2(80,150,'în realitate cele','două se suprapun')),

function blanket(x0,n,dx=22,y=140,h=22){let d=`M${x0} ${y}`;for(let i=0;i<=n;i++){const x=x0+i*dx;d+=` M${x} ${y} L${x} ${y-h}`;if(i<n)d+=` M${x} ${y} L${x+dx} ${y}`}return P(d,'thr')}
function hemCatch(x0,n,dx=40,y=110){let o='';for(let i=0;i<n;i++){const x=x0+i*dx;o+=P(`M${x} ${y} L${x+3} ${y-7} L${x+6} ${y}`,'thr');if(i<n-1)o+=P(`M${x+6} ${y+3} L${x+dx} ${y+3}`,'hid')}return o}

/* ================= PROIECTE =================
   Fiecare proiect calculează bucățile de tăiat din măsurile persoanei.
   Toate dimensiunile sunt în centimetri, rezervele de cusătură incluse.
   RC = rezerva de cusătură obișnuită. */
const RC=1.5;                      /* rezervă de cusătură */
const TIV=3;                       /* tiv dublu: 1 cm + 2 cm */
const r05=n=>Math.round(n*2)/2;    /* rotunjire la o jumătate de cm */
const cm=n=>String(r05(n)).replace('.',',');
const PI=Math.PI;

/* --- necesar de material: așezare pe rânduri, pe lățimea balotului --- */
function fabricNeed(pieces,W){
  const items=[];
  pieces.forEach(p=>{if(p.opt)return;const w=p.cutW!=null?p.cutW:p.w,h=p.cutH!=null?p.cutH:p.h;
    for(let i=0;i<(p.qty||1);i++)items.push({w,h,n:p.name})});
  items.sort((a,b)=>b.h-a.h);
  const rows=[];let prea=null;
  items.forEach(it=>{
    if(it.w>W){prea=it.n;return}
    let r=rows.find(x=>x.left>=it.w);
    if(!r){r={left:W,h:0};rows.push(r)}
    r.left-=it.w;r.h=Math.max(r.h,it.h);
  });
  const len=rows.reduce((s,r)=>s+r.h,0);
  return {len:r05(len*1.08+10),prea};   /* 8% pentru potrivit + 10 cm siguranță */
}

/* --- schema pieselor, desenată la scară din cotele calculate --- */
const hLab=(xr,y,v)=>(xr+5+String(cm(v)).length*7>314?T(xr-5,y,cm(v),'end','m'):T(xr+5,y,cm(v),'start','m'));
function drawPieces(pieces){
  const vis=pieces.filter(p=>!p.hide), G=36;
  const wOf=p=>p.shape==='donut'?2*p.R:p.w, hOf=p=>p.shape==='donut'?2*p.R:p.h;
  const sumW=vis.reduce((a,p)=>a+wOf(p),0), maxH=Math.max(...vis.map(hOf));
  const s=Math.min((286-G*(vis.length-1))/sumW,118/maxH);
  let x=17+(286-(sumW*s+G*(vis.length-1)))/2,o='';
  vis.forEach((p,i)=>{
    const w=wOf(p)*s,h=hOf(p)*s,y=40+(118-h)/2,cx=x+w/2,ny=i%2?y-22:y-8;
    if(p.shape==='donut'){
      o+=C(cx,y+h/2,w/2,'fab')+C(cx,y+h/2,p.r*s,'cut')+L(cx,y+h/2,cx+w/2,y+h/2,'dim')
       +T(cx,ny,p.name,'middle')+T(cx,y+h/2-p.r*s-6,'r '+cm(p.r),'middle','m')+T(cx+w/4,y+h/2-6,'R '+cm(p.R),'middle','m');
    }else if(p.shape==='trapez'){
      const wt=p.wTop*s;
      o+=P(`M${cx-wt/2} ${y} L${cx+wt/2} ${y} L${cx+w/2} ${y+h} L${cx-w/2} ${y+h} Z`,'fab')
       +T(cx,y-22,p.name,'middle')+T(cx,y-6,cm(p.wTop)+' sus','middle','m')
       +T(cx,y+h+15,cm(p.w)+' jos','middle','m')+hLab(cx+w/2,y+h/2,p.h);
    }else{
      o+=R(x,y,w,h,'fab')+T(cx,ny,p.name,'middle')
       +T(cx,y+h+15,cm(p.w),'middle','m')+hLab(x+w,y+h/2,p.h);
    }
    if(p.qty>1)o+=T(cx,y+h/2+5,'×'+p.qty,'middle');
    x+=w+G;
  });
  return svg(o+T(160,198,'cotele includ rezervele de cusătură','middle','m'),208);
}

/* ================= COPIEZ CEVA CE AM DEJA =================
   Poza stă în IndexedDB, pe telefon. Măsurile se iau de pe poză,
   pornind de la un obiect cu dimensiune cunoscută, pus lângă lucru. */
const IDB_DB='atelier',IDB_ST='poze';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(IDB_ST))d.createObjectStore(IDB_ST)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbPut(k,v){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(IDB_ST,'readwrite');
  t.objectStore(IDB_ST).put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)}))}
function idbGet(k){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(IDB_ST,'readonly');
  const q=t.objectStore(IDB_ST).get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)}))}
function idbDel(k){return idb().then(d=>new Promise(res=>{const t=d.transaction(IDB_ST,'readwrite');
  t.objectStore(IDB_ST).delete(k);t.oncomplete=()=>res(true)}))}

/* micșorează poza înainte de salvare: maximum 1600 px pe latura mare */
function pozaMica(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const M=1600,s=Math.min(1,M/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res({data:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height})};
      im.onerror=()=>rej(new Error('poza nu a putut fi citită'));im.src=fr.result};
    fr.onerror=()=>rej(new Error('fișierul nu a putut fi citit'));fr.readAsDataURL(file)});
}

  function overlay(poza){
    const S_=1000,Hh=1000*poza.h/poza.w;
    const pt=(p,cls)=>C(p.x*S_,p.y*Hh,9,cls);
    let o='';
    if(c.ref&&c.ref.a)o+=L(c.ref.a.x*S_,c.ref.a.y*Hh,c.ref.b.x*S_,c.ref.b.y*Hh,'phRef')+pt(c.ref.a,'phDotRef')+pt(c.ref.b,'phDotRef');
    c.masuri.forEach(m=>{o+=L(m.a.x*S_,m.a.y*Hh,m.b.x*S_,m.b.y*Hh,'phM')+pt(m.a,'phDot')+pt(m.b,'phDot')});
    if(TAP&&TAP.puncte.length===1)o+=pt(TAP.puncte[0],'phDotNew');
    return o;
  }

    cam.onchange=()=>{if(cam.files[0])ia(cam.files[0]);cam.value=''};

    if(b('fa'))b('fa').onclick=()=>cam.click();
    if(b('din'))b('din').onclick=()=>gal.click();
    if(b('schimb'))b('schimb').onclick=()=>gal.click();
    if(b('stergePoza'))b('stergePoza').onclick=async()=>{
      if(await confirma('Ștergi poza?','Măsurile luate de pe ea rămân, dar nu le mai poți verifica pe poză.')){
        await idbDel('copie_'+c.id);c.poza=0;save();render()}};
    app.querySelectorAll('[data-rep]').forEach(x=>x.onclick=async()=>{
      const r=REPERE.find(z=>z.k===x.dataset.rep);

      if(r.k==='alt'){const v=await intreaba('Cât are reperul?','Lungimea lui, în cm',c.ref&&c.ref.k==='alt'?String(c.ref.cm):'');

    if(b('setRef'))b('setRef').onclick=()=>{TAP={mod:'ref',puncte:[]};hint('Atinge un capăt al reperului, apoi celălalt.');render2()};
    if(b('addM'))b('addM').onclick=()=>{TAP={mod:'masura',puncte:[]};hint('Atinge cele două capete ale dimensiunii.');render2()};
    app.querySelectorAll('[data-delm]').forEach(x=>x.onclick=()=>{c.masuri.splice(+x.dataset.delm,1);save();render()});
    if(b('ren'))b('ren').onclick=async()=>{const n=await intreaba('Numele copiei','De exemplu: șorțul de la mama',c.nume);
      if(n){c.nume=n;save();copie(id)}};
    if(b('sterge'))b('sterge').onclick=async()=>{
      if(await confirma('Ștergi copia?','Se șterg poza și toate măsurile ei.')){
        await idbDel('copie_'+c.id);S.copii=S.copii.filter(z=>z.id!==c.id);save();location.hash='#/copii'}};
    const ph=document.getElementById('ph');
    if(ph)ph.onclick=ev=>{
      if(!TAP)return;
      const r=ph.getBoundingClientRect();
      const p={x:(ev.clientX-r.left)/r.width,y:(ev.clientY-r.top)/r.height};
      TAP.puncte.push(p);
      if(TAP.puncte.length<2){render2();hint('Acum al doilea punct.');return}

      if(TAP.mod==='ref'){c.ref.px=px;c.ref.a=a;c.ref.b=bb;TAP=null;save();render()}
      else{TAP=null;
        intreaba('Ce ai măsurat?','Numele dimensiunii, de exemplu „'+PUNCTE_SUG[c.masuri.length%PUNCTE_SUG.length]+'”','')
          .then(n=>{if(n){c.masuri.push({n,px,a,b:bb});save()}render()})}
    };
    function hint(t){const h=document.getElementById('hint');if(h)h.textContent=t||''}

  }
}

/* ---------- fișa de copiere ---------- */
function fisa(c,s){
  const M=c.masuri.map(m=>({n:m.n,cm:m.px*s}));
  const mare=Math.max(...M.map(m=>m.cm)), mic=M.length>1?M.slice().sort((a,b)=>a.cm-b.cm)[0].cm:mare;
  const taiat=M.map(m=>({n:m.n,cm:m.cm,cusatura:m.cm+2*RC,tiv:m.cm+RC+TIV}));
  const W=140, rand=Math.ceil((mare+2*RC)/W), nec=r05((rand*(mic+TIV+RC)+20)*1.08);
  const sug=PROJ.filter(p=>{
    const t=(p.t+' '+p.intro).toLowerCase(), nume=(c.nume||'').toLowerCase();
    return nume&&t.includes(nume.split(' ')[0]);
  }).slice(0,2);
  return `<section class="box"><h2>Fișa de copiere</h2>
   <p>Măsurile de pe poză sunt ale piesei finite. La tăiere adaugi rezervele: ${cm(RC)} cm pe fiecare margine care intră într-o cusătură și ${cm(TIV)} cm unde vine un tiv dublu.</p>
   <table class="tb"><thead><tr><th>Măsura</th><th>Finit</th><th>Cu cusături</th><th>Cu tiv</th></tr></thead><tbody>
    ${taiat.map(t=>`<tr><td>${esc(t.n)}</td><td>${cm(t.cm)}</td><td>${cm(t.cusatura)}</td><td>${cm(t.tiv)}</td></tr>`).join('')}
   </tbody></table>
   <p class="big">Material, orientativ: <b>${cm(nec)} cm</b> la lățimea de ${W} cm</p>
   <p>Estimarea pornește de la cea mai mare și cea mai mică dimensiune măsurată, deci e un ordin de mărime. Dacă lucrarea are căptușeală, ia de două ori.</p>
   <h2 style="margin-top:16px">De verificat pe lucrarea originală</h2><ul>
    <li>Câte bucăți are: față, spate, laterale, fund, căptușeală.</li>
    <li>Ce închidere are: fermoar, nasturi, elastic, șnur, nimic.</li>
    <li>Ce fel de margini: tiv dublu, biais, surfilat.</li>
    <li>Ce se vede pe dos: rezerve deschise sau călcate pe o parte.</li>
    <li>Ce material e, cât de gros și dacă se întinde.</li>
   </ul>
   <h2 style="margin-top:16px">Tehnicile de care ai nevoie, cel mai probabil</h2>
   <ul>${['tiv-dublu','zigzag','intarire','buzunar-aplicat'].filter(byId).map(t=>`<li><a href="#/t/${t}">${esc(byId(t).t)}</a></li>`).join('')}</ul>
   ${sug.length?`<p>Dacă seamănă cu un proiect gata calculat, pornește de acolo: ${sug.map(p=>`<a href="#/p/${p.id}">${esc(p.t)}</a>`).join(', ')}.</p>`:
     `<p>Dacă e un obiect din lista de proiecte (fustă, poșetă, șorț, față de pernă, săculeț), deschide direct proiectul: acolo primești bucățile exacte și pașii.</p>`}
  </section>`;
}

let DLG_POP=false;
function dialog({titlu,text,camp,val,ok='Gata',anuleaza='Renunță',pericol}){
  return new Promise(res=>{
    const w=document.createElement('div');w.className='ovl';
    w.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dgT">
      <h2 id="dgT">${esc(titlu)}</h2>
      ${text?`<p>${esc(text)}</p>`:''}
      ${camp!==undefined?`<label class="dlg-f"><span>${esc(camp)}</span>
        <input id="dgI" type="text" value="${esc(val||'')}" autocomplete="off" enterkeyhint="done"></label>`:''}
      <div class="dlg-b">
        <button class="btn" data-no>${esc(anuleaza)}</button>
        <button class="btn ${pericol?'dgr':'pri'}" data-yes>${esc(ok)}</button>
      </div></div>`;
    document.body.appendChild(w);
    const inp=w.querySelector('#dgI');
    const close=v=>{
      document.removeEventListener('keydown',key);
      w.classList.add('out');setTimeout(()=>w.remove(),140);
      if(DLG_POP){DLG_POP=false;history.back()}
      res(v);
    };
    const key=e=>{if(e.key==='Escape')close(null);
      if(e.key==='Enter'&&inp&&document.activeElement===inp){e.preventDefault();close(inp.value.trim()||null)}};
    document.addEventListener('keydown',key);
    w.querySelector('[data-no]').onclick=()=>close(null);
    w.querySelector('[data-yes]').onclick=()=>close(inp?(inp.value.trim()||null):true);
    w.onclick=e=>{if(e.target===w)close(null)};
    /* butonul Înapoi al telefonului închide fereastra, nu pagina */
    history.pushState({dlg:1},'');DLG_POP=true;
    const pop=()=>{DLG_POP=false;window.removeEventListener('popstate',pop);close(null)};
    window.addEventListener('popstate',pop,{once:true});
    setTimeout(()=>{(inp||w.querySelector('[data-yes]')).focus();if(inp)inp.select()},30);
  });
}

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
async function exportData(msg){
  const data=JSON.stringify({app:'atelier',ver:APP_VER,saved:new Date().toISOString(),fav:S.fav,done:S.done,notes:S.notes,people:S.people,proj:S.proj,copii:(S.copii||[]).map(c=>Object.assign({},c,{poza:0}))},null,1);
  const name=`Atelier_notite_${stamp()}.json`;
  try{const f=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});msg('Copia a fost trimisă.');return}}
  catch(e){if(e&&e.name==='AbortError'){msg('Ai anulat. Nu s-a salvat nicio copie.',1);return}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    msg(`Am pregătit fișierul ${name}. Verifică în Descărcări.`)}
  catch(e){msg('Nu am putut crea fișierul pe acest dispozitiv.',1)}
}
function importData(file,msg){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.app!=='atelier')throw 0;
      let n=0;Object.entries(o.notes||{}).forEach(([k,v])=>{if(!byId(k)||typeof v!=='string'||!v.trim())return;
        const cur=S.notes[k]||'';
        if(!cur.trim())S.notes[k]=v;               /* nu aveai nimic: iei notița din copie */
        else if(!cur.includes(v))S.notes[k]=cur+'\n\n'+v; /* aveai altceva: le păstrezi pe amândouă */
        else return;                               /* aveai deja exact asta */
        n++});
      Object.keys(o.fav||{}).forEach(k=>{if(byId(k))S.fav[k]=1});Object.keys(o.done||{}).forEach(k=>{if(byId(k))S.done[k]=1});
      (o.people||[]).forEach(p=>{if(p&&p.id&&!persById(p.id))S.people.push(p)});
      (o.copii||[]).forEach(x=>{if(x&&x.id&&!copieById(x.id))(S.copii=S.copii||[]).push(x)});
      Object.entries(o.proj||{}).forEach(([k,v])=>{if(!S.proj[k])S.proj[k]=v});
      const ok=save();
      msg(ok?(n?`Am adăugat notițe la ${n} ${n===1?'fișă':'fișe'}. Nimic din ce aveai nu s-a șters.`:'Copia nu conține notițe noi. Favoritele și exersatele au fost unite.'):'Nu am putut salva. Memoria browserului e plină sau blocată.',!ok)}
    catch(e){msg('Fișierul nu e o copie Atelier. Alege un fișier Atelier_notite_….json.',1)}};
  r.readAsText(file);
}

function zoomFig(svgHtml,cap){
  const w=document.createElement('div');w.className='ovl zoom';
  w.innerHTML=`<div class="zbox" role="dialog" aria-modal="true" aria-label="Desen mărit">
    <div class="zsvg">${svgHtml}</div><p>${esc(cap||'')}</p>
    <div class="dlg-b"><button class="btn pri" data-close>Închide</button></div></div>`;
  document.body.appendChild(w);
  const close=()=>{document.removeEventListener('keydown',k);w.remove();window.removeEventListener('popstate',pop)};
  const k=e=>{if(e.key==='Escape'){close();history.back()}};
  const pop=()=>close();
  document.addEventListener('keydown',k);history.pushState({z:1},'');window.addEventListener('popstate',pop,{once:true});
  w.querySelector('[data-close]').onclick=()=>{close();history.back()};
  w.onclick=e=>{if(e.target===w){close();history.back()}};
}
function bindZoom(){
  app.querySelectorAll('figure.fig').forEach(f=>{
    if(f.classList.contains('figm'))return;
    f.classList.add('zoomable');f.tabIndex=0;f.setAttribute('role','button');f.setAttribute('aria-label','Mărește desenul');
    const go=()=>{const c=f.querySelector('figcaption');
      const cap=c?[...c.childNodes].map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim():'';
      zoomFig(f.querySelector('svg').outerHTML,cap)};
    f.onclick=go;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
}

      <div class="seg"><button class="btn pri" id="addp">Adaugă o persoană</button></div>`;
    else{
      h+=`<div class="seg" role="group" aria-label="Pentru cine">
        ${S.people.map(x=>`<button class="btn${per&&x.id===per.id?' pri':''}" data-per="${x.id}">${esc(x.nume)}</button>`).join('')}
        <button class="btn" id="addp">+ Altă persoană</button>
        <a class="btn" href="#/persoane">Gestionează</a></div>
        <figure class="fig figm" id="bodyFig">${bodyFig(ACTIVE_M)}<figcaption><b>Unde se măsoară</b>Atinge un câmp și îți arăt linia pe manechin.</figcaption></figure>
        <div class="mm">${need.map(k=>{const mm=MASURI.find(z=>z.k===k);
          return `<label class="mm-r"><span>${esc(mm.l)}<small>${esc(mm.h)}</small></span>
            <input type="number" inputmode="decimal" step="0.5" min="${mm.min}" max="${mm.max}" data-m="${k}" value="${per&&per.m[k]||''}" aria-label="${esc(mm.l)} în cm"><b>cm</b></label>`}).join('')}</div>`;
    }
    h+=`</section>`;
  }
  if(p.opts.length){
    h+=`<section class="set"><h2>Alegerile tale</h2>`+p.opts.map(o=>`<p class="mm-l">${esc(o.l)}</p>
      <div class="seg" role="group" aria-label="${esc(o.l)}">${o.v.map(([v,l])=>
        `<button class="btn${String(st.opts[o.k])===String(v)?' pri':''}" data-opt="${o.k}" data-val="${v}">${esc(l)}</button>`).join('')}</div>`).join('')+`</section>`;
  }
  h+=`<div id="rez"></div><div id="pasi"></div></div>`;
  app.innerHTML=h;

  const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
  app.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{S.settings.pers=b.dataset.per;save();project(id)});
  const ap=document.getElementById('addp');
  if(ap)ap.onclick=async()=>{
    const n=await intreaba('Persoană nouă','Numele sau porecla','');
    if(n){addPerson(n);project(id)}};
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
    const o=p.opts.find(x=>x.k===b.dataset.opt);
    st.opts[b.dataset.opt]=o.num?num(b.dataset.val):b.dataset.val;save();project(id)});
  const bf=document.getElementById('bodyFig');
  const showM=k=>{ACTIVE_M=k;if(bf)bf.firstChild.outerHTML=bodyFig(k)};
  app.querySelectorAll('[data-m]').forEach(inp=>{
    inp.addEventListener('focus',()=>showM(inp.dataset.m));
    inp.addEventListener('blur',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.dataset||!document.activeElement.dataset.m)showM(null)},120));
  });
  app.querySelectorAll('[data-m]').forEach(inp=>inp.addEventListener('input',()=>{
    let pp=activePerson(); if(!pp){addPerson('Eu');pp=activePerson()}
    pp.m[inp.dataset.m]=num(inp.value);save();render()}));

  function render(){
    const per=activePerson(), st=pState(p,per);
    const lipsa=(p.needM||[]).filter(k=>!(per&&per.m[k]>0));
    const rez=document.getElementById('rez'),pasi=document.getElementById('pasi');
    if(lipsa.length){
      rez.innerHTML=`<p class="empty">Completează ${lipsa.map(k=>MASURI.find(z=>z.k===k).l.toLowerCase()).join(', ')} și îți calculez pe loc bucățile de tăiat.</p>`;
      pasi.innerHTML='';return;
    }
    const m=per?per.m:{}, r=p.calc(m,st.opts,st.W);
    const nec=fabricNeed(r.piese,st.W);
    rez.innerHTML=`<section class="box"><h2>De tăiat</h2>
      <figure class="fig">${drawPieces(r.piese)}<figcaption><b>Schema</b>Bucățile, la scară, cu cotele calculate din măsurile tale.</figcaption></figure>
      <table class="tb"><thead><tr><th>Bucata</th><th>Dimensiuni</th><th>Buc.</th></tr></thead><tbody>
      ${r.piese.map(x=>`<tr><td>${esc(x.name)}${x.note?`<small>${esc(x.note)}</small>`:''}</td>
        <td>${x.shape==='donut'?`rază interioară ${cm(x.r)} cm, rază exterioară ${cm(x.R)} cm`:
             x.shape==='trapez'?`${cm(x.wTop)} sus / ${cm(x.w)} jos × ${cm(x.h)} cm`:
             `${cm(x.w)} × ${cm(x.h)} cm`}</td><td>${x.qty}</td></tr>`).join('')}
      </tbody></table></section>
     <section class="box"><h2>Material</h2>
      <p class="mm-l">Lățimea balotului</p>
      <div class="seg" role="group" aria-label="Lățimea materialului">${[90,110,140,150].map(w=>
        `<button class="btn${st.W===w?' pri':''}" data-w="${w}">${w} cm</button>`).join('')}</div>
      <p class="big">${nec.prea?'Nu încape pe această lățime':`Îți trebuie aproximativ <b>${cm(nec.len)} cm</b>, adică ${(nec.len/100).toFixed(2).replace('.',',')} m`}</p>
      ${nec.prea?`<p class="msg err">Bucata „${esc(nec.prea)}” e mai lată decât ${st.W} cm. Alege un material mai lat sau o croială mai domoală.</p>`:
        `<p>Calculul include 8% pentru potrivit și 10 cm siguranță. Dacă materialul are model care trebuie potrivit sau fir cu direcție, ia cu 20% mai mult. Bucățile marcate opțional nu sunt socotite.</p>`}
      <h2 style="margin-top:16px">Mercerie</h2><ul>${r.mercerie.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      ${r.note.length?`<h2 style="margin-top:16px">De reținut</h2><ul>${r.note.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
     </section>`;
    const steps=p.pasi(m,st.opts);
    pasi.innerHTML=`<section class="box"><h2>Pașii</h2>
      <p class="mm-l">Bifează pe măsură ce avansezi. Rămâne salvat.</p>
      <ol class="pl">${steps.map((s,i)=>`<li class="${st.done.includes(i)?'ok':''}">
        <label><input type="checkbox" data-s="${i}"${st.done.includes(i)?' checked':''}>
        <span><b>${esc(s.h)}</b>${esc(s.p)}${s.tech&&byId(s.tech)?` <a href="#/t/${s.tech}">Vezi tehnica: ${esc(byId(s.tech).t)}</a>`:''}</span></label></li>`).join('')}</ol>
      <div class="seg"><button class="btn" id="reset">Șterge bifele</button></div></section>`;
    rez.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{st.W=+b.dataset.w;save();render()});
    bindZoom();
    pasi.querySelectorAll('[data-s]').forEach(c=>c.onchange=()=>{const i=+c.dataset.s;
      st.done=c.checked?[...new Set([...st.done,i])]:st.done.filter(x=>x!==i);save();render()});
    document.getElementById('reset').onclick=async()=>{
      if(await confirma('Ștergi bifele de la acest proiect?','Calculele și măsurile rămân neatinse.','Șterge bifele')){st.done=[];save();render()}};
  }
  render();
}

/* ================= diagnostic ================= */
async function diag(){
  app.innerHTML=`<div class="view"><a class="back" href="#/setari">← Setări</a>
   <header class="head"><h1>Diagnostic tehnic</h1></header>
   <p class="intro">Verific pe rând tot ce îi trebuie telefonului ca să poată instala aplicația.</p>
   <ul class="diag" id="dg"><li>Verific…</li></ul>
   <div class="seg" style="margin-top:18px"><button class="btn pri" id="cp">Copiază raportul</button></div>
   <p class="msg" id="dgMsg" role="status"></p></div>`;
  const rows=[],ul=document.getElementById('dg');
  const add=(ok,k,v)=>{rows.push([ok,k,v]);
    ul.innerHTML=rows.map(([o,a,b])=>`<li class="${o===1?'y':o===0?'n':'q'}"><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')};
  const url=u=>new URL(u,location.href).href;

  add(1,'Adresa',location.href);
  add(location.protocol==='https:'?1:0,'HTTPS',location.protocol==='https:'?'da':'nu: instalarea cere https');
  const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  add(2,'Rulează ca aplicație instalată',inst?'da':'nu, e deschisă în browser');
  add(2,'Browser',navigator.userAgent.slice(0,120));

  /* manifest */
  let man=null;
  const mlink=document.querySelector('link[rel="manifest"]');
  add(mlink?1:0,'Legătura spre manifest',mlink?mlink.getAttribute('href'):'lipsește din pagină');
  if(mlink){
    try{
      const r=await fetch(url(mlink.getAttribute('href')),{cache:'no-store'});
      const ct=r.headers.get('content-type')||'necunoscut';
      add(r.ok?1:0,'Manifestul se descarcă',`${r.status} ${r.statusText}, tip ${ct}`);
      if(r.ok){const txt=await r.text();
        try{man=JSON.parse(txt);add(1,'Manifestul e citibil',`name: ${man.name}, display: ${man.display}, start_url: ${man.start_url}`)}
        catch(e){add(0,'Manifestul e citibil','nu e JSON valid: '+e.message)}}
    }catch(e){add(0,'Manifestul se descarcă','eroare: '+e.message)}
  }
  if(man){
    const disp=['standalone','fullscreen','minimal-ui'].includes(man.display);
    add(disp?1:0,'display',man.display+(disp?'':': instalarea cere standalone'));
    const any=(man.icons||[]).filter(i=>!i.purpose||i.purpose.includes('any'));
    const s192=any.some(i=>/(^|\s)192x192(\s|$)/.test(i.sizes)),s512=any.some(i=>/(^|\s)512x512(\s|$)/.test(i.sizes));
    add(s192&&s512?1:0,'Iconițe declarate',`${(man.icons||[]).length} în manifest; 192 ${s192?'da':'nu'}, 512 ${s512?'da':'nu'}`);
    for(const ic of (man.icons||[])){
      try{const r=await fetch(url(ic.src),{cache:'no-store'});
        add(r.ok?1:0,'Iconița '+ic.src,`${r.status}, tip ${r.headers.get('content-type')||'necunoscut'}`)}
      catch(e){add(0,'Iconița '+ic.src,'eroare: '+e.message)}
    }
    try{const r=await fetch(url(man.start_url||'./'),{cache:'no-store'});
      add(r.ok?1:0,'start_url se deschide',`${man.start_url} → ${r.status}`)}
    catch(e){add(0,'start_url se deschide','eroare: '+e.message)}
  }

  /* service worker */
  if(!('serviceWorker' in navigator)){add(0,'Service worker','browserul nu îl acceptă')}
  else{
    try{const r=await fetch(url('sw.js'),{cache:'no-store'});
      add(r.ok?1:0,'Fișierul sw.js',`${r.status}, tip ${r.headers.get('content-type')||'necunoscut'}`)}
    catch(e){add(0,'Fișierul sw.js','eroare: '+e.message)}
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      const reg=regs.find(x=>location.href.startsWith(x.scope))||regs[0];
      add(reg?1:(location.protocol==='https:'?0:2),'Service worker înregistrat',reg?`scope ${reg.scope}`:(location.protocol==='https:'?'niciunul pentru această adresă: fără el, Chrome nu oferă instalarea':'niciunul: aplicația îl înregistrează doar pe https'));
      if(reg)add(reg.active?1:0,'Starea lui',`activ: ${reg.active?'da':'nu'}, în așteptare: ${reg.waiting?'da':'nu'}, se instalează: ${reg.installing?'da':'nu'}`);
      add(navigator.serviceWorker.controller?1:2,'Controlează pagina',navigator.serviceWorker.controller?'da':'nu încă, se activează de la următoarea deschidere');
    }catch(e){add(0,'Service worker înregistrat','eroare: '+e.message)}
    try{const ks=(await caches.keys()).filter(k=>k.startsWith('atelier-'));
      add(ks.length?1:2,'Cache-uri Atelier',ks.join(', ')||'niciunul încă');
      const c=ks.find(k=>k.startsWith('atelier-v'));
      if(c)add(c==='atelier-v'+APP_VER?1:2,'Versiunea din cache',c.replace('atelier-v','')+' față de '+APP_VER);
    }catch(e){add(2,'Cache-uri Atelier','eroare: '+e.message)}
  }
  try{const e=await navigator.storage.estimate();
    add(2,'Spațiu folosit',`${Math.round((e.usage||0)/1024)} kB din ${Math.round((e.quota||0)/1048576)} MB`)}catch(e){}
  add(2,'Versiunea aplicației',APP_VER);

  const raport=()=>'Atelier: raport diagnostic\n'+rows.map(([o,a,b])=>`${o===1?'[ok] ':o===0?'[!!] ':'[--] '}${a}: ${b}`).join('\n');
  const m=document.getElementById('dgMsg');
  document.getElementById('cp').onclick=async()=>{
    try{await navigator.clipboard.writeText(raport());m.textContent='Raportul e copiat. Trimite-l mai departe.'}
    catch(e){const ta=document.createElement('textarea');ta.value=raport();ta.style.cssText='width:100%;min-height:200px;margin-top:10px';
      m.textContent='Nu am putut copia. Selectează textul de mai jos:';m.after(ta);ta.select()}};
}

/* ================= rute ================= */
function route(){
  const h=location.hash||'#/';
  if(h.startsWith('#/t/'))sheet(decodeURIComponent(h.slice(4)));
  else if(h.startsWith('#/p/'))project(decodeURIComponent(h.slice(4)));
  else if(h==='#/legenda')legend();
  else if(h==='#/proiecte')projects();
  else if(h==='#/persoane')persoane();
  else if(h==='#/copii')copii();
  else if(h.startsWith('#/copie/'))copie(decodeURIComponent(h.slice(8)));
  else if(h==='#/setari')settings();
  else if(h==='#/diagnostic')diag();
  else home();
  window.scrollTo(0,0);
  bindZoom();
}
window.addEventListener('hashchange',route);
route();
PORNIT=true;

/* ================= versiune nouă ================= */
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude(usercontent)?\.(ai|site)/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(reg=>{
    const show=w=>{const b=document.getElementById('updbar');b.classList.add('on');
      document.getElementById('updgo').onclick=()=>w.postMessage('skip')};
    if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
    reg.update().catch(()=>{});
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
}

</script>
